    function UlarTanggaAesthetic() {

      const [winner, setWinner] = useState(null);
      const [activeChallenge, setActiveChallenge] = useState(null);
      const [pendingTeleport, setPendingTeleport] = useState(null);

      const [showRules, setShowRules] = useState(true); 
      const [gameStarted, setGameStarted] = useState(false); 
      const [isFullscreen, setIsFullscreen] = useState(false);
      
      // Set global berbasis teks tantangan agar 100% tidak pernah keluar dua kali untuk kedua pemain
      const usedDaresSet = useRef(new Set());

      const getCoords = (num) => {
        const adjustedNum = num - 1;
        const row = Math.floor(adjustedNum / COLS);
        let col = adjustedNum % COLS;
        const visualRow = 9 - row; 
        const isEvenRow = row % 2 === 0; 
        const visualCol = isEvenRow ? col : 9 - col;
        return { x: visualCol, y: visualRow };
      };

      const getRandomDare = () => {
        const rawDares = [...SECRET_START_DARES, ...DARES.any]
          .filter(d => d && typeof d === 'string' && !d.includes("Isi tantangan"))
          .map(d => d
            .replace(/Penuh Nafsumu/gi, 'pasanganmu')
            .replace(/penuh nafsu/gi, '')
            .replace(/\s+/g, ' ')
            .trim()
          );
        
        const uniquePool = Array.from(new Set(rawDares));
        const availableDares = uniquePool.filter(dareText => !usedDaresSet.current.has(dareText));
        
        if (availableDares.length === 0) {
          return "Semua kartu tantangan habis! Berikan 1 ciuman panas sebagai gantinya!";
        }
        
        const selectedDare = availableDares[Math.floor(Math.random() * availableDares.length)];
        usedDaresSet.current.add(selectedDare);
        return selectedDare;
      };

        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().then(() => { setIsFullscreen(true); }).catch(() => {});

          if (document.exitFullscreen) { document.exitFullscreen(); setIsFullscreen(false); }
        }
      };

        const handleFullscreenChange = () => { setIsFullscreen(!!document.fullscreenElement); };
        document.addEventListener('fullscreenchange', handleFullscreenChange);
        return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
      }, []);

          setTurn(randomTurn);
          setGameLog(`Takdir memilih: ${players[randomTurn].name} jalan duluan! 🎲`);
        } else {
          setTurn(startIdx);
          setGameLog(`${players[startIdx].name} mengambil inisiatif pertama! ✨`);
        }
        setGameStarted(true);
      };

        if (winner || isRolling || activeChallenge || isMoving) return; 
        setIsRolling(true);
        setGameLog(`${players[turn].name} rolling...`);
        let rollCount = 0;
        const interval = setInterval(() => {
          setDiceValue(Math.floor(Math.random() * 6) + 1);
          rollCount++;
          if (rollCount > 10) {

            finalizeMove();
          }

          while (currentPlayer.pos + roll === 100) {
            roll = Math.floor(Math.random() * 6) + 1;
          }
        }

        setIsRolling(false);
        setPlayers(prev => prev.map(p => p.id === currentPlayer.id ? { ...p, rolls: (p.rolls || 0) + 1 } : p));
        animateMovement(players[turn].id, roll);
      };

        let currentPlayer = players.find(p => p.id === playerId);
        let currentPos = currentPlayer.pos;
        let path = [];
        
        // Logika Pantulan Presisi di Kotak 100
        let tempPos = currentPos;
        let direction = 1;
        for (let i = 0; i < steps; i++) {
          tempPos += direction;
          if (tempPos === 100 && i < steps - 1) {
            direction = -1;
          }
          path.push(tempPos);
        }

          setPlayers(prev => prev.map(p => p.id === playerId ? { ...p, pos: stepPos } : p));

        let isBounce = (currentPos + steps) > 100;
        let logMessage = isBounce 
          ? `${currentPlayer.name} kelebihan dadu! Mundur balik ke ${finalPos} 😈` 
          : `${currentPlayer.name} tiba di ${finalPos}.`;

        if (finalPos === 100) {
          setWinner(currentPlayer);
          setGameLog(`✨ ${currentPlayer.name} MENCAPAI KLIMAKS! ✨`);

          setRestartDare(rDare);
          setIsMoving(false);
          return;

        let interactionType = null;

          interactionType = 'snake';
          logMessage = isBounce 
            ? `Mundur ke ${finalPos} & kena Ular! Meluncur turun ke ${nextDest} 🥀`

        }

          if (finalPos !== 1 && finalPos !== 100) {
            const dare = getRandomDare();
            if (nextDest) {
              setPendingTeleport({ to: nextDest, type: interactionType, playerId });
              setActiveChallenge({ text: dare, playerId, isTeleportStart: true });
            } else if (isBounce) {
              setActiveChallenge({ text: dare, playerId, isBounce: true });
            } else {
              setActiveChallenge({ text: dare, playerId });
            }
          } else {
            setIsMoving(false);
            setTurn(prev => (prev === 0 ? 1 : 0));
          }
        }, 500);
      };

          setTurn(prev => (prev === 0 ? 1 : 0));
        }

        const x2 = endPos.x + 0.5; const y2 = endPos.y + 0.5;
        const dx = x2 - x1; const dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy);
        const offsetX = (dy / len) * 0.12; const offsetY = (-dx / len) * 0.12;
        const steps = Math.floor(len / 0.3);

        return (
          <g key={`ladder-${index}`} className="drop-shadow-sm">
            <line x1={x1} y1={y1} x2={x2} y2={y2} stroke="rgba(255,255,255,0.8)" strokeWidth="0.6" strokeLinecap="round" />
            <line x1={x1 - offsetX} y1={y1 - offsetY} x2={x2 - offsetX} y2={y2 - offsetY} stroke="#2dd4bf" strokeWidth="0.1" strokeLinecap="round" />
            <line x1={x1 + offsetX} y1={y1 + offsetY} x2={x2 + offsetX} y2={y2 + offsetY} stroke="#2dd4bf" strokeWidth="0.1" strokeLinecap="round" />
            {Array.from({ length: steps }).map((_, i) => {
              const t = (i + 1) / (steps + 1);
              const sx = (x1 - offsetX) + (x2 - x1) * t;
              const sy = (y1 - offsetY) + (y2 - y1) * t;
              const ex = (x1 + offsetX) + (x2 - x1) * t;
              const ey = (y1 + offsetY) + (y2 - y1) * t;
              return <line key={i} x1={sx} y1={sy} x2={ex} y2={ey} stroke="#5eead4" strokeWidth="0.08" strokeLinecap="round" />;
            })}

            <path d={`M${x1},${y1} Q${cp1x},${my} ${x2},${y2}`} fill="none" stroke={snakeColor} strokeWidth="0.25" strokeLinecap="round" opacity="0.9"/>
            <path d={`M${x1},${y1} Q${cp1x},${my} ${x2},${y2}`} fill="none" stroke="white" strokeWidth="0.04" strokeDasharray="0.15" strokeLinecap="round" opacity="0.8"/>
            <circle cx={x1} cy={y1} r="0.25" fill={snakeColor} stroke="white" strokeWidth="0.05" />
            <circle cx={x1 - 0.08} cy={y1 - 0.05} r="0.06" fill="white" />
            <circle cx={x1 + 0.08} cy={y1 - 0.05} r="0.06" fill="white" />
          </g>
        );
      };

      return (
        <div className="min-h-screen w-full bg-[#fdfbfb] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-rose-100 via-teal-50 to-violet-100 flex flex-col items-center justify-start md:justify-center p-4 font-sans selection:bg-rose-200 overflow-x-hidden text-slate-800">
          
          {/* TOMBOL FULL SCREEN */}
          <div className="absolute top-4 right-4 z-40">
            <button onClick={toggleFullScreen} className="p-3 bg-white/60 backdrop-blur-lg rounded-full text-slate-500 hover:text-rose-500 hover:bg-white transition-all shadow-[0_4px_12px_rgba(0,0,0,0.05)] border border-white/80">
              {isFullscreen ? <Minimize size={20} /> : <Maximize size={20} />}
            </button>
          </div>

          {/* 1. LAYAR ATURAN */}
          {showRules && (
            <div className="fixed inset-0 z-[60] bg-white/40 backdrop-blur-2xl flex items-center justify-center p-4">
              <div className="bg-white/90 border border-white rounded-[2rem] p-8 max-w-md w-full text-center relative overflow-hidden shadow-[0_20px_60px_rgba(225,29,72,0.15)]">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-rose-400 to-orange-400"></div>
                <Flame className="w-16 h-16 text-rose-500 mx-auto mb-4 animate-bounce" size={64} strokeWidth={1.5} />
                
                <h2 className="text-3xl font-black text-slate-800 mb-2 uppercase tracking-tighter">PERINGATAN KERAS 🔞</h2>
                <p className="text-rose-400 text-xs mb-6 uppercase tracking-widest font-bold">Baca Dulu Sebelum Main!</p>

                <div className="text-left space-y-3 text-slate-600 text-sm font-medium mb-8 bg-rose-50/50 p-5 rounded-2xl border border-rose-100/50">
                  <p className="flex gap-3 bg-white p-3 rounded-xl shadow-sm border border-rose-100">
                    <span className="text-rose-500 font-black text-lg">⚠️</span>
                    <span className="font-bold text-rose-600">RULE UTAMA: TANGGALKAN SELURUH PAKAIANMU SEKARANG!</span>
                  </p>
                  <p className="flex gap-3 px-1">
                    <span className="text-rose-400 font-black text-lg">1.</span>
                    <span>Game ini khusus dewasa. Pantang tolak tantangan! Nolak = <b className="text-rose-500">HUKUMAN BERAT</b>.</span>
                  </p>
                  <p className="flex gap-3 px-1">
                    <span className="text-rose-400 font-black text-lg">2.</span>
                    <span>Finish harus PAS angka 100. Kalo lebih, <b>MUNDUR</b> & Wajib Tantangan!</span>
                  </p>
                  <p className="flex gap-3 px-1">
                    <span className="text-rose-400 font-black text-lg">3.</span>
                    <span>Durasi setiap tantangan <b className="text-rose-500">BEBAS</b>, tapi maksimal <b className="text-rose-500">5 MENIT</b> agar permainan tetap jalan!</span>
                  </p>
                  <p className="flex gap-3 px-1">
                    <span className="text-rose-400 font-black text-lg">4.</span>
                    <span>Siapin mental & fisik. Kita main sampe lemes!</span>
                  </p>
                </div>

                <button onClick={handleCloseRules} className="w-full py-4 bg-gradient-to-r from-rose-500 to-orange-400 hover:from-rose-600 hover:to-orange-500 text-white font-black uppercase tracking-widest rounded-2xl shadow-lg shadow-rose-200 transition-all hover:-translate-y-1 flex items-center justify-center gap-2">
                  Gue Siap Main! <Play size={18} fill="white"/>
                </button>
                <p className="text-slate-400 text-[10px] mt-6 font-mono tracking-widest">CREATE BY : CK</p>
              </div>
            </div>
          )}

          {/* 2. MENU PEMILIHAN GILIRAN */}
          {!gameStarted && !showRules && (
            <div className="fixed inset-0 z-50 bg-white/40 backdrop-blur-2xl flex items-center justify-center p-4">
              <div className="bg-white/90 rounded-[2.5rem] shadow-[0_20px_60px_rgba(0,0,0,0.08)] p-8 max-w-md w-full text-center border border-white relative overflow-hidden">
                <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-indigo-300 via-purple-300 to-rose-300"></div>
                <h2 className="text-2xl font-black text-slate-800 mb-2 mt-2">Siapa Jalan Duluan?</h2>
                <p className="text-slate-500 text-sm mb-8">Pilih inisiator permainan hari ini.</p>
                
                <div className="grid grid-cols-1 gap-4">
                  <button onClick={() => handleStartGame(0)} className="flex items-center justify-between px-6 py-5 bg-indigo-50/50 hover:bg-indigo-50 text-indigo-700 rounded-2xl font-bold group border border-indigo-100 transition-all">
                    <div className="flex items-center gap-4">
                      <div className="w-10 h-10 bg-indigo-500 rounded-full flex items-center justify-center text-white shadow-md shadow-indigo-200"><MaleIcon className="w-5 h-5"/></div>
                      <span className="text-lg">Romeo</span>
                    </div>
                    <ArrowUp className="opacity-0 group-hover:opacity-100 transition-opacity" size={20} />
                  </button>
                  
                  <button onClick={() => handleStartGame(1)} className="flex items-center justify-between px-6 py-5 bg-rose-50/50 hover:bg-rose-50 text-rose-700 rounded-2xl font-bold group border border-rose-100 transition-all">
                    <div className="flex items-center gap-4">
                      <div className="w-10 h-10 bg-rose-500 rounded-full flex items-center justify-center text-white shadow-md shadow-rose-200"><FemaleIcon className="w-5 h-5"/></div>
                      <span className="text-lg">Juliet</span>
                    </div>
                    <ArrowUp className="opacity-0 group-hover:opacity-100 transition-opacity" size={20} />
                  </button>
                  
                  <button onClick={() => handleStartGame('random')} className="flex items-center justify-center gap-2 px-6 py-5 bg-slate-800 text-white rounded-2xl shadow-xl hover:bg-slate-700 transition-all mt-2 font-bold tracking-wide">
                    <Shuffle size={18} /> Acak Saja
                  </button>
                </div>
                <p className="text-slate-400 text-[10px] mt-8 font-mono tracking-widest uppercase">Create By : CK</p>
              </div>
            </div>
          )}

          {/* 3. LAYAR PEMENANG */}
          {winner && (
            <div className="fixed inset-0 z-[70] bg-white/60 backdrop-blur-2xl flex items-center justify-center p-4">
              <div className="bg-white rounded-[3rem] shadow-[0_30px_100px_rgba(251,146,60,0.2)] max-w-md w-full p-10 text-center relative overflow-hidden border border-white">
                <div className="absolute top-0 left-0 w-full h-40 bg-gradient-to-b from-orange-100 to-transparent opacity-50"></div>
                
                <div className="w-24 h-24 bg-gradient-to-br from-yellow-300 to-orange-400 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg shadow-orange-200 relative z-10 animate-bounce">
                  <Trophy size={40} className="text-white" fill="currentColor"/>
                </div>
                
                <h2 className="text-4xl font-black text-slate-800 mb-2 uppercase tracking-tighter relative z-10">
                  {winner.name} MENANG!
                </h2>
                <p className="text-orange-500 text-xs font-bold tracking-widest mb-8 relative z-10">TAPI PERMAINAN BELUM SELESAI...</p>

                <div className="bg-rose-50 border border-rose-100 p-6 rounded-3xl mb-10 relative z-10">
                  <h3 className="text-rose-400 font-bold text-[10px] uppercase tracking-widest mb-3">HUKUMAN UNTUK YANG KALAH</h3>
                  <p className="text-xl font-black text-slate-700 leading-snug">"{restartDare}"</p>
                </div>

                <button 
                  onClick={resetGame} 
                  className="w-full py-5 bg-slate-900 text-white font-bold rounded-2xl hover:bg-slate-800 hover:-translate-y-1 transition-all shadow-xl shadow-slate-900/20 relative z-10 flex items-center justify-center gap-3 text-lg"
                >
                  Sudah Dilakukan! Main Lagi <RotateCcw size={20}/>
                </button>
              </div>
            </div>
          )}

          {/* HEADER */}
          <div className="text-center mt-2 mb-3 lg:mb-4 z-10">
            <div className="inline-flex items-center justify-center gap-3 px-6 py-2 bg-white/70 backdrop-blur-xl rounded-full shadow-[0_8px_30px_rgba(0,0,0,0.04)] border-2 border-rose-200 mb-2">
              <Heart className="text-rose-500 w-5 h-5 animate-pulse" size={20} fill="currentColor" />
              <h1 className="text-xl md:text-2xl font-black text-slate-800 uppercase tracking-widest">Love Board</h1>
              <Heart className="text-rose-500 w-5 h-5 animate-pulse" size={20} fill="currentColor" />
            </div>
            <div className="flex flex-col items-center gap-0.5">
              <p className="text-slate-600 text-xs font-semibold tracking-wide">100 Pas atau Mundur 😈</p>
              <p className="text-slate-400 text-[9px] font-mono tracking-widest uppercase">Create By : CK</p>
            </div>
          </div>

          {/* BOARD & CONTROLS CONTAINER */}
          <div className="flex flex-col lg:flex-row gap-6 items-center justify-center w-full h-full lg:px-8 pb-20 md:pb-0 z-10">
            {/* BOARD DENGAN BORDER KOTAK JELAS & SILUET POSISI */}
            <div className="relative aspect-square w-full max-w-[88vw] lg:max-w-none lg:h-[68vh] lg:w-[68vh] mx-auto bg-white/80 backdrop-blur-3xl rounded-[2rem] shadow-[0_20px_60px_rgba(225,29,72,0.12)] border-[4px] border-rose-300 overflow-hidden shrink-0 p-3 group">
              <div className="absolute inset-0 bg-gradient-to-tr from-rose-100/40 via-transparent to-teal-100/40 pointer-events-none"></div>
              <div className="grid grid-cols-10 grid-rows-10 h-full w-full gap-1 bg-rose-200/70 rounded-[1.25rem] overflow-hidden p-1.5 border-2 border-rose-300 shadow-inner relative z-10">
                {Array.from({ length: 100 }, (_, i) => {
                  const row = Math.floor(i / 10);
                  const normalizedRow = 9 - row;
                  let displayNum;
                  if (normalizedRow % 2 === 0) { const col = i % 10; displayNum = (normalizedRow * 10) + (col + 1); } 
                  else { const col = i % 10; displayNum = (normalizedRow * 10) + (10 - col); }
                  const isDark = (row + (i % 10)) % 2 !== 0;
                  const cellBg = isDark ? 'bg-white border-rose-300' : 'bg-rose-50/95 border-rose-300/90';
                  
                  const SilhouetteComponent = displayNum !== 1 && displayNum !== 100 
                    ? PositionSilhouettes[displayNum % PositionSilhouettes.length] 
                    : null;
                  
                  return (
                    <div key={i} className={`relative flex items-center justify-center rounded-[6px] transition-all duration-300 ${cellBg} border-2 shadow-sm hover:shadow-md hover:-translate-y-[1px] hover:z-10 hover:bg-white hover:border-rose-500 group/cell`}>
                      <span className="absolute top-0.5 left-1 text-[8px] md:text-[10px] lg:text-[11px] text-slate-700 font-black group-hover/cell:text-rose-600 transition-colors z-10 bg-white/70 px-1 rounded">{displayNum}</span>
                      
                      {SilhouetteComponent && (
                        <div className="absolute inset-0 flex items-center justify-center pt-2 opacity-65 group-hover/cell:opacity-100 group-hover/cell:scale-110 transition-all duration-200 pointer-events-none">
                          <SilhouetteComponent className="w-[72%] h-[72%] text-rose-600 drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]" />
                        </div>
                      )}

                      {displayNum === 100 && <Heart className="w-5 h-5 md:w-6 md:h-6 text-rose-500 drop-shadow-sm animate-pulse z-10" fill="currentColor" />}
                      {displayNum === 1 && <span className="text-[6px] md:text-[8px] font-black text-teal-600 tracking-wider px-1 py-0.5 bg-teal-100/80 border border-teal-300 rounded z-10">START</span>}
                    </div>
                  );
                })}
              </div>
              <svg className="absolute inset-0 w-full h-full pointer-events-none p-3 z-20" viewBox="0 0 10 10">
                {Object.entries(LADDERS).map(([start, end], i) => renderAestheticLadder(start, end, i))}
                {Object.entries(SNAKES).map(([start, end], i) => renderAestheticSnake(start, end, i))}
              </svg>
              <div className="absolute inset-0 w-full h-full pointer-events-none p-3 z-30">
                {players.map((player, idx) => {
                  const coords = getCoords(player.pos);
                  const offset = idx === 0 ? -10 : 10;
                  return (
                    <div 
                      key={player.id} 
                      className={`absolute w-[6%] h-[6%] md:w-[6.5%] md:h-[6.5%] rounded-full shadow-lg border-[2.5px] border-white flex items-center justify-center transition-all duration-300 ease-linear ${player.color}`} 
                      style={{ left: `calc(${coords.x * 10}% + 2% + ${offset}px)`, top: `calc(${coords.y * 10}% + 2%)` }}
                    >
                      {player.type === 'romeo' ? <MaleIcon className="text-white w-[55%] h-[55%]" /> : <FemaleIcon className="text-white w-[55%] h-[55%]" />}
                    </div>
                  );
                })}
              </div>
            </div>

            {/* CONTROLS */}
            <div className="flex-1 w-full max-w-[88vw] md:max-w-xs flex flex-col gap-4 mx-auto lg:mx-0">
              <div className="bg-white/70 backdrop-blur-xl p-4 rounded-[1.75rem] shadow-[0_8px_30px_rgba(0,0,0,0.04)] border-2 border-white">
                <h2 className="text-[10px] font-black text-slate-500 mb-3 tracking-widest uppercase text-center flex items-center justify-center gap-2">
                  <Sparkles size={12} className="text-rose-400"/> GILIRAN <Sparkles size={12} className="text-rose-400"/>
                </h2>
                <div className="flex gap-3">
                  {players.map((p, idx) => (
                    <div key={p.id} className={`flex-1 flex flex-col items-center justify-center p-3 rounded-2xl transition-all duration-300 border ${turn === idx ? 'bg-white border-rose-200 shadow-[0_8px_20px_rgba(225,29,72,0.08)] scale-105' : 'bg-white/40 border-transparent opacity-60 grayscale'}`}>
                      <div className={`w-8 h-8 rounded-full ${p.color} flex items-center justify-center text-white mb-1.5 border-2 border-white shadow-sm`}>
                        {p.type === 'romeo' ? <MaleIcon className="w-4 h-4"/> : <FemaleIcon className="w-4 h-4"/>}
                      </div>
                      <span className="text-[10px] font-black text-slate-700 uppercase tracking-widest">{p.name}</span>
                      <span className="text-xl font-bold text-slate-500 mt-0.5">{p.pos}</span>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white/80 backdrop-blur-2xl p-5 rounded-[2rem] shadow-[0_15px_40px_rgba(0,0,0,0.05)] border-2 border-white text-center relative overflow-hidden flex flex-col items-center">
                <div className="absolute top-0 w-full h-1 bg-gradient-to-r from-indigo-400 via-rose-400 to-orange-400"></div>
                
                <div className="min-h-[2.75rem] w-full flex items-center justify-center text-slate-700 font-semibold text-xs md:text-sm mb-4 bg-rose-50/60 p-2.5 rounded-xl border border-rose-200/60">
                  {gameLog}
                </div>
                
                <button 
                  onClick={handleRollDice} 
                  disabled={!!winner || !!activeChallenge || isRolling || isMoving || !gameStarted} 
                  className="w-20 h-20 bg-white rounded-[1.5rem] flex items-center justify-center text-3xl font-black text-slate-800 shadow-[0_8px_25px_rgba(225,29,72,0.12)] border-2 border-rose-200 hover:border-rose-400 hover:scale-105 active:scale-95 transition-all duration-300 disabled:opacity-50 disabled:scale-100 mb-2 group"
                >
                  <span className={isRolling ? "animate-spin text-rose-500" : "bg-gradient-to-br from-rose-500 to-orange-500 bg-clip-text text-transparent group-hover:scale-110 transition-transform"}>
                    {isRolling ? <RotateCcw size={28}/> : diceValue}
                  </span>
                </button>
                <span className="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em]">Kocok Dadu</span>
              </div>
            </div>
          </div>

          {/* CHALLENGE MODAL */}
          {activeChallenge && (
            <div className="fixed inset-0 bg-slate-900/20 backdrop-blur-xl flex items-end md:items-center justify-center z-50 p-4">
              <div className="bg-white rounded-[3rem] shadow-[0_30px_100px_rgba(0,0,0,0.15)] w-full max-w-sm p-10 text-center border border-white relative overflow-hidden mb-4 md:mb-auto">
                <div className="absolute top-0 left-0 w-full h-32 bg-gradient-to-b from-rose-50 to-transparent pointer-events-none"></div>
                
                <div className="relative z-10">
                  <div className="w-20 h-20 mx-auto bg-white rounded-full shadow-[0_10px_30px_rgba(225,29,72,0.1)] flex items-center justify-center mb-6 ring-8 ring-rose-50/50">
                    {activeChallenge.isTeleportStart ? <Cloud className="text-indigo-400" size={32} /> : 
                     activeChallenge.isTeleportEnd ? <Sparkles className="text-orange-400" size={32} /> :
                     activeChallenge.isBounce ? <AlertTriangle className="text-red-500" size={32} /> :
                     <Gift className="text-rose-500" size={32} />}
                  </div>

                  <h3 className="text-rose-400 text-[10px] font-black uppercase tracking-[0.25em] mb-4 bg-rose-50 inline-block px-3 py-1 rounded-full">
                    {activeChallenge.isBounce ? "HUKUMAN MENTAL!" : `UNTUK ${players.find(p => p.id === activeChallenge.playerId)?.name}`}
                  </h3>
                  
                  <p className="text-xl md:text-2xl font-bold text-slate-800 mb-10 leading-tight">
                    "{activeChallenge.text}"
                  </p>
                  
                  <button onClick={handleChallengeComplete} className="w-full py-5 rounded-2xl bg-slate-900 text-white font-bold text-lg shadow-xl shadow-slate-900/20 hover:-translate-y-1 transition-all duration-300 flex items-center justify-center gap-2">
                    {pendingTeleport ? "Lanjutkan" : "Selesai"} <Play size={18} fill="currentColor"/>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<UlarTanggaAesthetic />);
  </script>
</body>
</html>
